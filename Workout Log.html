<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout Log</title>
<style>
:root{--bg:#fff;--bg2:#f2f2f7;--ink:#000;--mute:#8e8e93;--line:#e5e5ea;--blue:#007aff;--green:#34c759;--gtint:#dff7e6;--box:#e5e5ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--bg2:#1c1c1e;--ink:#fff;--mute:#8e8e93;--line:#2c2c2e;--blue:#0a84ff;--green:#30d158;--gtint:#12331c;--box:#2c2c2e}}
:root[data-theme="dark"]{--bg:#000;--bg2:#1c1c1e;--ink:#fff;--mute:#8e8e93;--line:#2c2c2e;--blue:#0a84ff;--green:#30d158;--gtint:#12331c;--box:#2c2c2e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit}
#app{max-width:560px;margin:auto;padding:0 16px 150px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin:0 -16px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}
.top .c{text-align:center;min-width:0}.top b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top small{color:var(--mute);font-size:12px}
.back{color:var(--blue);font-size:17px;min-width:64px}
.fin{background:var(--green);color:#fff;border:0;border-radius:8px;padding:7px 14px;font-weight:600;min-width:64px;cursor:pointer}
h1{font-size:32px;font-weight:800;letter-spacing:-.02em;margin:18px 0 4px}
h2{font-size:13px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin:24px 0 8px}
.sub{color:var(--mute);margin:0}
.stats{display:flex;gap:28px;padding:12px 0}.stats small{display:block;color:var(--mute);font-size:12px}.stats b{font-size:17px;font-weight:600}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;border-bottom:1px solid var(--line);scrollbar-width:none}.strip::-webkit-scrollbar{display:none}
.pill{flex:none;width:40px;height:40px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-weight:600;font-size:15px;color:var(--mute);position:relative}
.pill.on{background:var(--blue);color:#fff}.pill.c{background:var(--green);color:#fff}.pill.p::after{content:"";position:absolute;right:2px;top:2px;width:10px;height:10px;border-radius:50%;background:#ff9f0a;border:2px solid var(--bg)}
.pill.r{background:transparent;border:1.5px dashed var(--line)}
.ex{padding:18px 0 6px}
.ex h3{margin:0;color:var(--blue);font-size:18px;font-weight:700}
.note{color:var(--mute);font-size:13px;margin:2px 0 10px}
.tbl{display:grid;grid-template-columns:34px 1fr 62px 56px 40px;gap:6px;align-items:center}
.th{font-size:11px;color:var(--mute);font-weight:700;text-align:center;letter-spacing:.03em}
.row{display:contents}.row>*{padding:4px 0}
.row.d>*{background:var(--gtint)}
.sn{text-align:center;font-weight:700;color:var(--mute)}
.pv{text-align:center;color:var(--mute);font-size:14px}
.in{width:100%;text-align:center;border:0;background:var(--bg2);border-radius:6px;padding:8px 2px;font:600 16px inherit;color:var(--ink)}
.in:focus{outline:2px solid var(--blue)}
.row.d .in{background:transparent}
.ck{width:34px;height:34px;border-radius:7px;border:0;background:var(--box);display:grid;place-items:center;cursor:pointer;margin:auto}
.row.d .ck{background:var(--green)}.ck svg{width:18px;opacity:0;stroke:#fff}.row.d .ck svg{opacity:1}
.add{width:100%;margin-top:8px;border:0;background:var(--bg2);border-radius:8px;padding:9px;font-weight:600;font-size:14px;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{border:1px solid var(--line);border-radius:12px;padding:12px;display:block;min-height:112px;background:var(--bg)}
.card h3{margin:0 0 4px;font-size:16px}.card p{margin:0;color:var(--mute);font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .st{margin-top:8px;font-size:12px;font-weight:600;color:var(--mute)}
.card.p{border-color:var(--blue)}.card.p .st{color:var(--blue)}.card.c .st{color:var(--green)}.card.r{background:var(--bg2);border:0;min-height:0;padding:10px 12px}
.bar{height:6px;background:var(--bg2);border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--blue);border-radius:9px}
.list{background:var(--bg2);border-radius:12px;padding:4px 16px}.list>div{padding:12px 0;border-bottom:1px solid var(--line)}.list>div:last-child{border:0}.list b{display:block;margin-bottom:2px}.list span{color:var(--mute);font-size:14px}
.hc{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}.hc h3{margin:0}.hc small{color:var(--mute)}
.hl{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-top:6px}.hl span:last-child{color:var(--mute);white-space:nowrap}
.hs{display:flex;gap:16px;font-size:13px;color:var(--mute);margin:6px 0 8px}
.lnk{background:none;border:0;color:#ff3b30;padding:12px 0;cursor:pointer;font-size:16px;display:block}
.empty{text-align:center;color:var(--mute);padding:60px 0}
.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:8}
.tabs a{flex:1;max-width:180px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;font-size:10.5px;font-weight:500;color:var(--mute)}
.tabs a.on{color:var(--blue)}.tabs svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#timer{position:fixed;left:12px;right:12px;max-width:536px;margin:auto;bottom:calc(66px + env(safe-area-inset-bottom,0px));background:var(--blue);color:#fff;border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:10px;z-index:9;transform:translateY(200%);transition:transform .25s;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#timer.show{transform:none}#timer .l{font-size:13px;opacity:.85;margin-right:auto}#timer .t{font:700 22px ui-monospace,Menlo,monospace}
#timer button{background:rgba(255,255,255,.22);border:0;border-radius:8px;padding:6px 10px;color:#fff;font-weight:600;font-size:13px;cursor:pointer}
.tg{background:var(--bg2);border:0;border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer;margin-top:12px}
.seg{display:flex;background:var(--bg2);border-radius:9px;padding:3px}.seg button{flex:1;border:0;background:transparent;padding:8px;border-radius:7px;font-weight:600;font-size:14px;cursor:pointer;color:var(--mute)}.seg button.on{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.card.nx{border-color:var(--blue)}.card.nx .st{color:var(--blue)}
</style>
</head>
<body>
<div id="app"></div>
<div id="timer"><span class="l">Rest timer</span><span class="t" id="tt">0:00</span><button onclick="addT(15)">+15</button><button onclick="stopT()">Skip</button></div>
<nav class="tabs" id="tabs"></nav>
<script>
const D=[
{n:1,t:'Upper A',f:'Chest & Pressing Emphasis',e:[['Incline Dumbbell Press',3,'6–8','2.5–3 min',180,'1–2'],['Chest-Supported T-Bar or Cable Row',3,'8–10','2 min',120,'1–2'],['Flat Machine or Barbell Bench Press',3,'8–10','2–3 min',180,'1–2'],['Lat Pulldown (Neutral/Medium Grip)',3,'10–12','2 min',120,'1–2'],['Cable Lateral Raise',4,'12–15','60–90s',90,'0–1'],['Incline Dumbbell Biceps Curl',3,'10–12','90s',90,'0–1'],['Overhead Cable Triceps Extension',3,'10–12','90s',90,'0–1']]},
{n:2,t:'Lower A',f:'Quad Emphasis',e:[['Barbell Back Squat or Hack Squat',3,'6–8','3 min',180,'1–2'],['Lying Leg Curl',3,'10–12','2 min',120,'1'],['Bulgarian Split Squat or Leg Press',3,'8–10','2 min',120,'1–2'],['Leg Extension',2,'12–15','90s',90,'0'],['Standing Calf Raise',4,'10–12','90s',90,'0–1'],['Cable Woodchopper or Hanging Leg Raise',3,'12–15','60s',60,'1']]},
{n:3,t:'Rest',rest:1},
{n:4,t:'Upper B',f:'Back & Pulling Emphasis',e:[['Single-Arm Cable Row or Barbell Row',3,'6–8','2.5 min',150,'1–2'],['Standing Overhead Barbell/Dumbbell Press',3,'8–10','2.5 min',150,'1–2'],['Pull-Ups or Assisted Chin-Ups',3,'8–10','2 min',120,'1–2'],['Pec Deck or Low-to-High Cable Flye',3,'12–15','90s',90,'0–1'],['Dumbbell Lateral Raise',4,'10–12','60–90s',90,'0–1'],['Dumbbell Hammer Curl',3,'10–12','90s',90,'0–1'],['Triceps Rope Pushdown',3,'12–15','90s',90,'0–1']]},
{n:5,t:'Lower B',f:'Hamstring & Glute Emphasis',e:[['Romanian Deadlift (RDL)',3,'6–8','3 min',180,'1–2'],['Dumbbell Walking Lunges or Hack Squat',3,'10–12','2 min',120,'1–2'],['Seated Hamstring Curl',3,'10–12','2 min',120,'0–1'],['Cable Pull-Through or Hip Thrust',2,'10–12','90s',90,'1'],['Seated Calf Raise',4,'12–15','90s',90,'0–1'],['Ab Wheel Rollout or Cable Crunch',3,'10–12','60s',60,'1']]},
{n:6,t:'Rest',rest:1}];
const KEY='strong-style-v1';let S={log:{},hist:[],done:{},start:{},prev:{},cyc:1,theme:'auto'};
try{S=Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=i=>document.getElementById(i),tr=D.filter(d=>!d.rest);
const lg=n=>{if(!S.log[n])S.log[n]=D[n-1].e.map(x=>Array.from({length:x[1]},()=>({w:'',r:'',d:0})));return S.log[n]};
const flat=n=>S.log[n]?S.log[n].flat():null;
const dn=n=>flat(n)?flat(n).filter(o=>o.d).length:0;
const tot=n=>flat(n)?flat(n).length:D[n-1].e.reduce((a,x)=>a+x[1],0);
const vol=n=>flat(n)?flat(n).filter(o=>o.d).reduce((a,o)=>a+(+o.w||0)*(+o.r||0),0):0;
const st=n=>D[n-1].rest?'r':dn(n)>0?'p':S.done[n]?'c':'n';
const stL={r:'Rest day',n:'Not started',p:'In progress',c:'Completed'};
const ic={work:'<svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>',hist:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',guide:'<svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2zM4 19V5M9 8h6"/></svg>',ck:'<svg viewBox="0 0 24 24" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'};
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const fd=t=>new Date(t).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
function home(){
 const fin=tr.filter(d=>S.done[d.n]).length,nx=tr.find(d=>!S.done[d.n]);
 return `<div style="display:flex;justify-content:space-between;align-items:center"><h1>Workout</h1><button class="tg" onclick="flipTheme()" aria-label="Toggle light/dark theme">${isDark()?'☀️':'🌙'}</button></div><p class="sub">Cycle ${S.cyc} · ${fin} of ${tr.length} workouts done</p><div class="bar"><i style="width:${fin/tr.length*100}%"></i></div>
 <h2>4-day Upper/Lower split</h2><div class="grid">${D.map(d=>{const s=st(d.n),up=s==='n'&&nx&&nx.n===d.n;return d.rest?`<a class="card r" href="#/day/${d.n}"><h3 style="margin:0;font-size:14px">Day ${d.n} · Rest</h3><p>Active recovery</p></a>`:`<a class="card ${s} ${up?'nx':''}" href="#/day/${d.n}"><h3>Day ${d.n} · ${d.t}</h3><p>${d.e.map(x=>x[0]).join(', ')}</p><div class="st">${s==='p'?`${dn(d.n)}/${tot(d.n)} sets · `:''}${up?'Up next':stL[s]}</div>${s==='p'?`<div class="bar"><i style="width:${dn(d.n)/tot(d.n)*100}%"></i></div>`:''}</a>`}).join('')}</div>
 <p class="sub" style="text-align:center;margin-top:16px;font-size:13px">The cycle repeats automatically — Cycle ${S.cyc+1} starts when you log your next Day 1 after finishing this one.</p>`}
function topbar(l,c,s,r){return `<div class="top"><a class="back" href="#/">‹ ${l}</a><div class="c"><b>${c}</b><small>${s}</small></div>${r||'<span style="min-width:64px"></span>'}</div>`}
function day(n){
 const d=D[n-1];if(!d)return home();
 const strip=`<div class="strip">${D.map(x=>`<a class="pill ${x.n===n?'on':st(x.n)==='c'?'c':st(x.n)==='p'?'p':x.rest?'r':''}" href="#/day/${x.n}">${st(x.n)==='c'&&x.n!==n?'✓':x.n}</a>`).join('')}</div>`;
 if(d.rest)return topbar('Workout','Day '+n+' · Rest','Active recovery')+strip+`<div class="empty"><div style="font-size:44px">🌿</div><h2 style="font-size:20px;color:var(--ink);text-transform:none;letter-spacing:0">Rest & Active Recovery</h2>Let your muscles recover. Light walking, mobility work or stretching are great options.</div>`;
 const L=lg(n);
 return topbar('Workout','Day '+n+' · '+d.t,d.f+' · '+stL[st(n)],`<button class="fin" onclick="finish(${n})">Finish</button>`)+
 `<div class="stats"><div><small>Duration</small><b id="dur">${S.start[n]?mmss(Math.floor((Date.now()-S.start[n])/1000)):'0:00'}</b></div><div><small>Volume</small><b>${vol(n).toLocaleString()} lbs</b></div><div><small>Sets</small><b>${dn(n)}/${tot(n)}</b></div></div>`+strip+
 `<p class="note" style="margin:10px 0 0">Warm-up: do 2–3 ramp-up sets on the first exercise. They don't count toward working sets.</p>`+
 d.e.map((x,i)=>{const k=n+'-'+i;return `<div class="ex"><h3>${x[0]}</h3><div class="note">${x[2]} reps · Rest ${x[3]} · RIR ${x[5]}</div>
 <div class="tbl"><div class="th">SET</div><div class="th">PREVIOUS</div><div class="th">LBS</div><div class="th">REPS</div><div class="th">✓</div>
 ${L[i].map((o,s)=>{const p=S.prev[k]&&S.prev[k][s];return `<div class="row ${o.d?'d':''}"><div class="sn">${s+1}</div><div class="pv">${p?(p.w||0)+' × '+p.r:'—'}</div><input class="in" inputmode="decimal" value="${o.w}" placeholder="${p?p.w:''}" oninput="inp(${n},${i},${s},'w',this.value)"><input class="in" inputmode="numeric" value="${o.r}" placeholder="${p?p.r:parseInt(x[2])}" oninput="inp(${n},${i},${s},'r',this.value)"><button class="ck" onclick="tick(${n},${i},${s})" aria-label="Complete set">${ic.ck}</button></div>`}).join('')}</div>
 <button class="add" onclick="addSet(${n},${i})">+ Add Set</button></div>`}).join('')+
 `<button class="lnk" onclick="cancel(${n})">Cancel Workout</button>`}
function hist(){
 if(!S.hist.length)return `<h1>History</h1><div class="empty">No workouts yet.<br>Finish a workout and it will show up here.</div>`;
 return `<h1>History</h1><p class="sub">${S.hist.length} workouts logged</p><h2>&nbsp;</h2>`+S.hist.map(h=>`<div class="hc"><h3>${h.t}</h3><small>${fd(h.ts)}</small><div class="hs"><span>⏱ ${h.dur}</span><span>🏋 ${h.vol.toLocaleString()} lbs</span><span>${h.sets} sets</span></div>${h.ex.map(e=>`<div class="hl"><span>${e[1]} × ${e[0]}</span><span>${e[2]}</span></div>`).join('')}</div>`).join('')}
function guide(){return `<h1>Guide</h1><p class="sub">Progression & execution</p><h2>Principles</h2><div class="list">
<div><b>Double progression</b><span>Pick a weight you can handle for the lower bound of the rep range. Once you hit the top of the range (e.g. 8 reps) on all sets with clean technique, add 2.5–5 lbs in the following workout.</span></div>
<div><b>Target RIR</b><span>Keep 1–2 reps in reserve on multi-joint compounds to preserve recovery and joint health. On single-joint isolation lifts (flyes, curls, pushdowns) push to 0–1 RIR — failure or one rep short.</span></div>
<div><b>Warm-up sets</b><span>Do 2–3 ramp-up sets on the first exercise of each session. Warm-up sets don't count toward your working set totals.</span></div></div>
<h2>Appearance</h2><div class="seg">${['auto','light','dark'].map(t=>`<button class="${S.theme===t?'on':''}" onclick="setTheme('${t}')">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div><h2>Data</h2><button class="lnk" style="color:var(--blue)" onclick="newWeek()">Start next cycle (keep history)</button><button class="lnk" onclick="wipe()">Delete all data</button>`}
function render(){
 const h=location.hash.replace(/^#\/?/,'');let tab='w',html;
 if(h.startsWith('day/'))html=day(+h.slice(4));else if(h==='history'){tab='h';html=hist()}else if(h==='guide'){tab='g';html=guide()}else html=home();
 $('app').innerHTML=html;
 $('tabs').innerHTML=[['history','History','hist','h'],['','Workout','work','w'],['guide','Guide','guide','g']].map(t=>`<a class="${tab===t[3]?'on':''}" href="#/${t[0]}">${ic[t[2]]}${t[1]}</a>`).join('');
 document.title=h.startsWith('day/')&&D[+h.slice(4)-1]?`Day ${h.slice(4)} · ${D[+h.slice(4)-1].t}`:'Workout Log'}
function touch(n){if(!S.start[n])S.start[n]=Date.now()}
function inp(n,i,s,f,v){lg(n)[i][s][f]=v;touch(n);save()}
function tick(n,i,s){const o=lg(n)[i][s],x=D[n-1].e[i],p=S.prev[n+'-'+i]&&S.prev[n+'-'+i][s];
 if(!o.d){if(o.w===''&&p)o.w=p.w;if(o.r==='')o.r=p?p.r:String(parseInt(x[2]));o.d=1;touch(n);startT(x[4])}else o.d=0;save();render()}
function addSet(n,i){lg(n)[i].push({w:'',r:'',d:0});save();render()}
function finish(n){const L=lg(n),d=D[n-1];if(!dn(n)){alert('Complete at least one set to finish.');return}
 if(!confirm(dn(n)<tot(n)?'Some sets are incomplete. Finish workout anyway?':'Finish workout?'))return;
 const ex=[];d.e.forEach((x,i)=>{const k=n+'-'+i,ds=L[i].filter(o=>o.d);if(ds.length){S.prev[k]=ds.map(o=>({w:o.w,r:o.r}));const b=ds.reduce((a,o)=>(+o.w||0)*(+o.r||0)>=(+a.w||0)*(+a.r||0)?o:a,ds[0]);ex.push([x[0],ds.length,(b.w||0)+' lbs × '+b.r])}});
 S.hist.unshift({day:n,t:d.t,ts:Date.now(),dur:mmss(Math.floor((Date.now()-S.start[n])/1000)),vol:vol(n),sets:dn(n),ex});S.hist=S.hist.slice(0,60);
 if(S.done[n]){S.done={};S.cyc++}S.done[n]=Date.now();delete S.log[n];delete S.start[n];save();stopT();location.hash='#/'}
function cancel(n){if(!confirm('Cancel this workout? Logged sets will be discarded.'))return;delete S.log[n];delete S.start[n];save();stopT();render()}
function newWeek(){if(!confirm('Start the next cycle? Progress for this one is cleared; history is kept. History is kept.'))return;S.done={};S.log={};S.start={};S.cyc++;save();location.hash='#/'}
function wipe(){if(!confirm('Delete ALL data including history?'))return;S={log:{},hist:[],done:{},start:{},prev:{},cyc:1,theme:'auto'};save();applyTheme();location.hash='#/';render()}
const isDark=()=>S.theme==='dark'||(S.theme!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);
function applyTheme(){S.theme==='auto'?document.documentElement.removeAttribute('data-theme'):document.documentElement.setAttribute('data-theme',S.theme)}
function setTheme(t){S.theme=t;save();applyTheme();render()}
function flipTheme(){setTheme(isDark()?'light':'dark')}
applyTheme();
let tl=0,ti;
function startT(s){tl=s;clearInterval(ti);$('timer').classList.add('show');$('tt').textContent=mmss(tl);ti=setInterval(()=>{tl--;if(tl<=0){stopT();try{navigator.vibrate&&navigator.vibrate(300)}catch(e){}}else $('tt').textContent=mmss(tl)},1000)}
function addT(s){tl+=s;$('tt').textContent=mmss(tl)}
function stopT(){clearInterval(ti);$('timer').classList.remove('show')}
setInterval(()=>{const e=$('dur'),n=+location.hash.slice(6);if(e&&S.start[n])e.textContent=mmss(Math.floor((Date.now()-S.start[n])/1000))},1000);
addEventListener('hashchange',()=>{render();scrollTo(0,0)});render();
</script>
</body>
</html>
